<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFO OS - Sign in</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#eef1f5;color:#1a1a2e;display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:16px}
  .card{background:#fff;border:1px solid #dce3ec;border-radius:12px;box-shadow:0 2px 10px rgba(5,28,44,.08);padding:32px 28px;width:100%;max-width:340px}
  .logo{width:40px;height:40px;border-radius:9px;background:#051c2c;display:flex;align-items:center;justify-content:center;color:#fff;font-size:19px;font-weight:700;margin:0 auto 14px}
  h1{font-size:17px;text-align:center;margin-bottom:2px}
  p.sub{font-size:11.5px;color:#5a6b82;text-align:center;margin-bottom:22px}
  label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:#9aa7b8;margin-bottom:4px}
  input{width:100%;font-family:inherit;font-size:13px;background:#f4f6f9;border:1px solid #c7d2e0;border-radius:8px;padding:9px 11px;color:#1a1a2e;outline:none;margin-bottom:14px}
  input:focus{border-color:#1f4e79}
  button{width:100%;background:#051c2c;color:#fff;border:none;border-radius:8px;padding:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  button:disabled{opacity:.6;cursor:default}
  .err{background:#f9ebe9;color:#c0392b;border:1px solid #c0392b;border-radius:7px;padding:8px 10px;font-size:11.5px;margin-bottom:14px;display:none}
</style>
</head>
<body>
<form class="card" id="login-form" autocomplete="on">
  <div class="logo">◈</div>
  <h1>CFO OS</h1>
  <p class="sub">Akij Resource &middot; iBOS ERP</p>
  <div class="err" id="err"></div>
  <label>Username</label>
  <input type="text" id="username" name="username" autocomplete="username" required autofocus>
  <label>Password</label>
  <input type="password" id="password" name="password" autocomplete="current-password" required>
  <button type="submit" id="submit-btn">Sign in</button>
</form>
<script>
const form = document.getElementById("login-form");
const err = document.getElementById("err");
const btn = document.getElementById("submit-btn");
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  err.style.display = "none";
  btn.disabled = true; btn.textContent = "Signing in...";
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Login failed");
    window.location.href = "/";
  } catch (ex) {
    err.textContent = ex.message;
    err.style.display = "block";
    btn.disabled = false; btn.textContent = "Sign in";
  }
});
</script>
</body>
</html>
