<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFO OS - Admin</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Arial,sans-serif;background:#eef1f5;color:#1a1a2e;min-height:100vh;min-height:100dvh}
  header{background:#051c2c;color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header .logo{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  header h1{font-size:15px;font-weight:700}
  header .spacer{flex:1}
  header a{color:#a7b6c7;text-decoration:none;font-size:12px;padding:6px 12px;border:1px solid rgba(255,255,255,.25);border-radius:7px}
  header a:hover{color:#fff;border-color:#fff}
  main{max-width:760px;margin:0 auto;padding:24px 16px}
  .card{background:#fff;border:1px solid #dce3ec;border-radius:12px;box-shadow:0 2px 10px rgba(5,28,44,.06);padding:20px;margin-bottom:16px}
  .card h2{font-size:14px;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:#5a6b82;font-weight:600;padding:6px 8px;border-bottom:1px solid #c7d2e0;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
  td{padding:8px;border-bottom:1px solid #eef1f5}
  .badge{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:#e8eef4;color:#1f4e79}
  .del-btn{font-size:11px;color:#c0392b;background:none;border:1px solid #c0392b;border-radius:6px;padding:3px 9px;cursor:pointer}
  .del-btn:disabled{opacity:.4;cursor:default}
  form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:#9aa7b8}
  input{font-family:inherit;font-size:12.5px;background:#f4f6f9;border:1px solid #c7d2e0;border-radius:7px;padding:7px 9px;color:#1a1a2e;outline:none}
  .chk{flex-direction:row;align-items:center;gap:6px}
  button.primary{background:#051c2c;color:#fff;border:none;border-radius:7px;padding:8px 16px;font-size:12.5px;cursor:pointer;font-family:inherit;height:33px}
  .err,.ok{border-radius:7px;padding:8px 10px;font-size:11.5px;margin-bottom:12px;display:none}
  .err{background:#f9ebe9;color:#c0392b;border:1px solid #c0392b}
  .ok{background:#e6f2ec;color:#1a7a4c;border:1px solid #1a7a4c}
</style>
</head>
<body>
<header>
  <div class="logo">◈</div>
  <h1>CFO OS &middot; Admin panel</h1>
  <span class="spacer"></span>
  <a href="/">&larr; Dashboard</a>
  <a href="#" id="logout-link">Sign out</a>
</header>
<main>
  <div class="card">
    <h2>Add user</h2>
    <div class="err" id="add-err"></div>
    <div class="ok" id="add-ok"></div>
    <form id="add-form">
      <div class="fld"><label>Username</label><input type="text" id="new-username" required></div>
      <div class="fld"><label>Password</label><input type="password" id="new-password" required minlength="6"></div>
      <div class="fld chk" style="flex-direction:row"><input type="checkbox" id="new-is-admin"><label>Admin</label></div>
      <button type="submit" class="primary">Add user</button>
    </form>
  </div>
  <div class="card">
    <h2>Users</h2>
    <table>
      <thead><tr><th>Username</th><th>Role</th><th>Created</th><th></th></tr></thead>
      <tbody id="users-body"></tbody>
    </table>
  </div>
</main>
<script>
async function api(path, opts) {
  const res = await fetch(path, {headers: {"Content-Type": "application/json"}, ...opts});
  if (res.status === 401 || res.status === 403) { window.location.href = "/"; throw new Error("unauthorized"); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

async function loadUsers() {
  const users = await api("/api/admin/users");
  document.getElementById("users-body").innerHTML = users.map(u => `
    <tr>
      <td>${u.username}</td>
      <td>${u.is_admin ? '<span class="badge">Admin</span>' : 'User'}</td>
      <td>${new Date(u.created_at).toLocaleString()}</td>
      <td><button class="del-btn" data-id="${u.id}" ${u.username === "admin" ? "disabled" : ""}>Remove</button></td>
    </tr>
  `).join("");
}

document.getElementById("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const addErr = document.getElementById("add-err"), addOk = document.getElementById("add-ok");
  addErr.style.display = "none"; addOk.style.display = "none";
  try {
    await api("/api/admin/users", {method: "POST", body: JSON.stringify({
      username: document.getElementById("new-username").value,
      password: document.getElementById("new-password").value,
      is_admin: document.getElementById("new-is-admin").checked,
    })});
    document.getElementById("add-form").reset();
    addOk.textContent = "User added."; addOk.style.display = "block";
    loadUsers();
  } catch (ex) {
    addErr.textContent = ex.message; addErr.style.display = "block";
  }
});

document.getElementById("users-body").addEventListener("click", async (e) => {
  const btn = e.target.closest(".del-btn");
  if (!btn || btn.disabled) return;
  if (!confirm("Remove this user?")) return;
  await api("/api/admin/users/" + btn.dataset.id, {method: "DELETE"});
  loadUsers();
});

document.getElementById("logout-link").addEventListener("click", async (e) => {
  e.preventDefault();
  await api("/api/auth/logout", {method: "POST"});
  window.location.href = "/";
});

loadUsers();
</script>
</body>
</html>
